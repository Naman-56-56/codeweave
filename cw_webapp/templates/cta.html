<script>
document.addEventListener('DOMContentLoaded', function() {
    const ctaVisual = document.getElementById('ctaVisual');
    const floatingElements = document.querySelectorAll('.floating-element');
    
    // Physics properties
    const elements = [];
    const containerWidth = 320;
    const containerHeight = 320;
    const elementSize = 50;
    const bounceStrength = 0.7;
    const friction = 0.95;
    const minDistance = 70; // Minimum distance between elements
    let animationId = null;
    let isActive = true;
    
    // Initialize physics for each element
    floatingElements.forEach((element, index) => {
        const rect = element.getBoundingClientRect();
        const containerRect = ctaVisual.getBoundingClientRect();
        
        elements.push({
            element: element,
            x: rect.left - containerRect.left + elementSize / 2,
            y: rect.top - containerRect.top + elementSize / 2,
            vx: 0,
            vy: 0,
            originalX: rect.left - containerRect.left + elementSize / 2,
            originalY: rect.top - containerRect.top + elementSize / 2
        });
    });
    
    // Mouse interaction
    let mouseX = 0;
    let mouseY = 0;
    let mouseInContainer = false;
    
    ctaVisual.addEventListener('mousemove', function(e) {
        const rect = ctaVisual.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
        mouseInContainer = true;
    });
    
    ctaVisual.addEventListener('mouseleave', function() {
        mouseInContainer = false;
    });
    
    // Keep the physics active by preventing it from stopping
    ctaVisual.addEventListener('mouseenter', function() {
        if (!isActive) {
            isActive = true;
            updatePhysics();
        }
    });
    
    // Prevent the animation from stopping
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden && isActive) {
            updatePhysics();
        }
    });
    
    // Physics update function
    function updatePhysics() {
        elements.forEach((el, index) => {
            // Enhanced mouse repulsion with better responsiveness
            if (mouseInContainer) {
                const deltaX = mouseX - el.x;
                const deltaY = mouseY - el.y;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                const repulsionRadius = 120;
                const repulsionStrength = 0.4;
                
                if (distance < repulsionRadius && distance > 0) {
                    // Enhanced force calculation with better responsiveness
                    const normalizedDistance = distance / repulsionRadius;
                    const force = Math.pow(1 - normalizedDistance, 1.5);
                    let repulsionX = (deltaX / distance) * force * repulsionStrength;
                    let repulsionY = (deltaY / distance) * force * repulsionStrength;
                    
                    // Check if repulsion would push element out of bounds
                    const repulsionMargin = 5;
                    const newX = el.x - repulsionX;
                    const newY = el.y - repulsionY;
                    
                    if (newX - elementSize / 2 < repulsionMargin || newX + elementSize / 2 > containerWidth - repulsionMargin) {
                        repulsionX *= 0.3; // Reduce horizontal repulsion near boundaries
                    }
                    if (newY - elementSize / 2 < repulsionMargin || newY + elementSize / 2 > containerHeight - repulsionMargin) {
                        repulsionY *= 0.3; // Reduce vertical repulsion near boundaries
                    }
                    
                    el.vx -= repulsionX;
                    el.vy -= repulsionY;
                }
            }
            
            // Wall bouncing with stricter boundaries
            const boundaryMargin = 5; // Keep elements away from edges
            
            if (el.x - elementSize / 2 <= boundaryMargin) {
                el.x = boundaryMargin + elementSize / 2;
                el.vx = Math.abs(el.vx) * bounceStrength;
            }
            if (el.x + elementSize / 2 >= containerWidth - boundaryMargin) {
                el.x = containerWidth - boundaryMargin - elementSize / 2;
                el.vx = -Math.abs(el.vx) * bounceStrength;
            }
            if (el.y - elementSize / 2 <= boundaryMargin) {
                el.y = boundaryMargin + elementSize / 2;
                el.vy = Math.abs(el.vy) * bounceStrength;
            }
            if (el.y + elementSize / 2 >= containerHeight - boundaryMargin) {
                el.y = containerHeight - boundaryMargin - elementSize / 2;
                el.vy = -Math.abs(el.vy) * bounceStrength;
            }
            
            // Element-to-element collision with improved spacing
            elements.forEach((otherEl, otherIndex) => {
                if (index !== otherIndex) {
                    const deltaX = otherEl.x - el.x;
                    const deltaY = otherEl.y - el.y;
                    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                    
                    if (distance < minDistance && distance > 0) {
                        // Repulsion force for better spacing
                        const angle = Math.atan2(deltaY, deltaX);
                        const overlap = minDistance - distance;
                        const repulsionForce = (overlap / minDistance) * 0.8;
                        
                        // Apply repulsion force
                        const repulsionX = Math.cos(angle) * repulsionForce;
                        const repulsionY = Math.sin(angle) * repulsionForce;
                        
                        el.vx -= repulsionX;
                        el.vy -= repulsionY;
                        otherEl.vx += repulsionX;
                        otherEl.vy += repulsionY;
                        
                        // Gentle collision response
                        const moveX = (overlap * Math.cos(angle)) / 2;
                        const moveY = (overlap * Math.sin(angle)) / 2;
                        
                        el.x -= moveX;
                        el.y -= moveY;
                        otherEl.x += moveX;
                        otherEl.y += moveY;
                    }
                }
            });
            
            // Apply velocity
            el.x += el.vx;
            el.y += el.vy;
            
            // Ensure elements stay within bounds (final safety check)
            const safetyMargin = 5;
            el.x = Math.max(safetyMargin + elementSize / 2, Math.min(containerWidth - safetyMargin - elementSize / 2, el.x));
            el.y = Math.max(safetyMargin + elementSize / 2, Math.min(containerHeight - safetyMargin - elementSize / 2, el.y));
            
            // Apply friction
            el.vx *= friction;
            el.vy *= friction;
            
            // Smooth return to original position when mouse is not in container
            if (!mouseInContainer) {
                const targetX = el.originalX;
                const targetY = el.originalY;
                const dx = targetX - el.x;
                const dy = targetY - el.y;
                
                // Smooth easing for return movement
                el.x += dx * 0.03;
                el.y += dy * 0.03;
                el.vx *= 0.85;
                el.vy *= 0.85;
            }
            
            // Update element position with better performance
            const transformX = el.x - el.originalX;
            const transformY = el.y - el.originalY;
            el.element.style.transform = `translate(${transformX}px, ${transformY}px)`;
        });
        
        if (isActive) {
            animationId = requestAnimationFrame(updatePhysics);
        }
    }
    
    // Start physics loop with restart mechanism
    updatePhysics();
    
    // Restart physics if it stops (safety mechanism)
    setInterval(() => {
        if (!isActive && mouseInContainer) {
            isActive = true;
            updatePhysics();
        }
    }, 1000);
});
</script>
