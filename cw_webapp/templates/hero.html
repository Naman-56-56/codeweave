<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeWeave - Advanced Hero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: #000000;
            color: #fff;
            overflow-x: hidden;
        }

        .hero-container {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 140, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 165, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255, 127, 0, 0.06) 0%, transparent 50%),
                linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #000000 100%);
            overflow: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 140, 0, 0.3);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.5);
        }

        .particle:nth-child(1) { width: 60px; height: 60px; top: 15%; left: 8%; animation-delay: -0.5s; }
        .particle:nth-child(2) { width: 90px; height: 90px; top: 65%; left: 85%; animation-delay: -2s; }
        .particle:nth-child(3) { width: 40px; height: 40px; top: 85%; left: 15%; animation-delay: -3.5s; }
        .particle:nth-child(4) { width: 80px; height: 80px; top: 25%; left: 75%; animation-delay: -1s; }
        .particle:nth-child(5) { width: 50px; height: 50px; top: 8%; left: 65%; animation-delay: -4s; }
        .particle:nth-child(6) { width: 70px; height: 70px; top: 50%; left: 5%; animation-delay: -2.5s; }
        .particle:nth-child(7) { width: 35px; height: 35px; top: 75%; left: 90%; animation-delay: -3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.3; }
            33% { transform: translateY(-80px) rotate(120deg) scale(1.2); opacity: 0.8; }
            66% { transform: translateY(-40px) rotate(240deg) scale(0.8); opacity: 0.5; }
        }

        /* Grid Background */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 140, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 140, 0, 0.05) 1px, transparent 1px);
            background-size: 80px 80px;
            z-index: 2;
        }

        /* Hero Content */
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 900px;
            padding: 60px 40px;
            transform-style: preserve-3d;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, #ff8c00, #ffa500, #ff7f00);
            background-size: 200% 200%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease-in-out infinite;
            margin-bottom: 1rem;
            transform: translateZ(50px);
            text-shadow: 0 0 30px rgba(255, 140, 0, 0.3);
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 300;
            color: #cccccc;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
            transform: translateZ(30px);
            line-height: 1.5;
        }

        .hero-description {
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            color: #999;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeInUp 1s ease 1s forwards;
            transform: translateZ(20px);
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* 3D Buttons */
        .cta-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
            opacity: 0;
            animation: fadeInUp 1s ease 1.5s forwards;
        }

        .cta-button {
            position: relative;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            transform: translateZ(40px);
        }

        .cta-primary {
            background: linear-gradient(135deg, #ff8c00, #ffa500);
            color: #000000;
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4);
        }

        .cta-secondary {
            background: transparent;
            color: #ff8c00;
            border: 2px solid #ff8c00;
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.2);
        }

        .cta-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 140, 0, 0.5);
        }

        /* Floating Elements */
        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .floating-shape {
            position: absolute;
            background: linear-gradient(45deg, #ff8c00, #ffa500, #ff7f00);
            border-radius: 50%;
            opacity: 0.15;
            animation: floatShape 10s infinite ease-in-out;
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.3);
        }

        .floating-shape:nth-child(1) {
            width: 180px;
            height: 180px;
            top: 8%;
            left: 3%;
            animation-delay: 0s;
        }

        .floating-shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 75%;
            right: 8%;
            animation-delay: -3s;
        }

        .floating-shape:nth-child(3) {
            width: 90px;
            height: 90px;
            top: 45%;
            left: 85%;
            animation-delay: -6s;
        }

        .floating-shape:nth-child(4) {
            width: 150px;
            height: 150px;
            top: 20%;
            right: 20%;
            animation-delay: -1.5s;
        }

        .floating-shape:nth-child(5) {
            width: 60px;
            height: 60px;
            top: 60%;
            left: 10%;
            animation-delay: -4.5s;
        }

        @keyframes floatShape {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.1; }
            25% { transform: translateY(-60px) rotate(90deg) scale(1.3); opacity: 0.25; }
            50% { transform: translateY(-30px) rotate(180deg) scale(0.8); opacity: 0.15; }
            75% { transform: translateY(-80px) rotate(270deg) scale(1.1); opacity: 0.2; }
        }

        /* Animations */
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-content {
                padding: 40px 20px;
            }

            .cta-container {
                flex-direction: column;
                align-items: center;
            }

            .cta-button {
                width: 80%;
                max-width: 300px;
            }

            .floating-shape {
                display: none;
            }
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            opacity: 0;
            animation: fadeIn 2s ease 2s forwards;
        }

        .scroll-arrow {
            width: 30px;
            height: 30px;
            border-right: 2px solid #ff8c00;
            border-bottom: 2px solid #ff8c00;
            transform: rotate(45deg);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) rotate(45deg); }
            40% { transform: translateY(-10px) rotate(45deg); }
            60% { transform: translateY(-5px) rotate(45deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Performance optimization */
        .hero-container * {
            will-change: transform;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Animated Background -->
        <div class="bg-animation">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <!-- Grid Background -->
        <div class="grid-bg"></div>

        <!-- Floating Elements -->
        <div class="floating-elements">
            <div class="floating-shape"></div>
            <div class="floating-shape"></div>
            <div class="floating-shape"></div>
            <div class="floating-shape"></div>
            <div class="floating-shape"></div>
        </div>

        <!-- Hero Content -->
        <div class="hero-content">
            <h1 class="hero-title">CodeWeave</h1>
            <p class="hero-subtitle">Weaving Innovation into Every Line of Code</p>
            <p class="hero-description">
                Experience the future of development with our cutting-edge platform. 
                Transform your ideas into reality with powerful tools, seamless workflows, 
                and innovative solutions designed for modern creators.
            </p>
            
            <div class="cta-container">
                <a href="#" class="cta-button cta-primary">Start Creating</a>
                <a href="#" class="cta-button cta-secondary">Explore Features</a>
            </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator">
            <div class="scroll-arrow"></div>
        </div>
    </div>

    <script>
        // Performance optimization
        let ticking = false;
        
        function updateAnimations() {
            ticking = false;
        }
        
        function requestTick() {
            if (!ticking) {
                requestAnimationFrame(updateAnimations);
                ticking = true;
            }
        }

        // Smooth scroll for scroll indicator
        document.querySelector('.scroll-indicator').addEventListener('click', () => {
            window.scrollTo({
                top: window.innerHeight,
                behavior: 'smooth'
            });
        });

        // Loading animation
        window.addEventListener('load', () => {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
