<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Codeweave Portal</title>
    <style>
        /* Enhanced CSS Variables */
:root {
  /* Enhanced Color Palette */
  --primary-50: #eff6ff;
  --primary-100: #dbeafe;
  --primary-200: #bfdbfe;
  --primary-300: #93c5fd;
  --primary-400: #60a5fa;
  --primary-500: #3b82f6;
  --primary-600: #2563eb;
  --primary-700: #1d4ed8;
  --primary-800: #1e40af;
  --primary-900: #1e3a8a;
  
  --secondary-50: #f0fdf4;
  --secondary-100: #dcfce7;
  --secondary-200: #bbf7d0;
  --secondary-300: #86efac;
  --secondary-400: #4ade80;
  --secondary-500: #22c55e;
  --secondary-600: #16a34a;
  --secondary-700: #15803d;
  --secondary-800: #166534;
  --secondary-900: #14532d;
  
  --accent-50: #faf5ff;
  --accent-100: #f3e8ff;
  --accent-200: #e9d5ff;
  --accent-300: #d8b4fe;
  --accent-400: #c084fc;
  --accent-500: #a855f7;
  --accent-600: #9333ea;
  --accent-700: #7c3aed;
  --accent-800: #6b21a8;
  --accent-900: #581c87;
  
  /* Light Mode Colors - Matching Theme */
  --bg-primary: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
  --bg-secondary: rgba(26, 26, 46, 0.95);
  --bg-tertiary: rgba(22, 33, 62, 0.8);
  --text-primary: #ffffff;
  --text-secondary: #b3b3b3;
  --text-tertiary: #666666;
  --text-muted: #888888;
  --border-primary: rgba(102, 126, 234, 0.2);
  --border-secondary: rgba(118, 75, 162, 0.2);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
  --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  --glass-bg: rgba(26, 26, 46, 0.3);
  --glass-border: rgba(102, 126, 234, 0.1);
  --backdrop-blur: 20px;
  
  /* Enhanced Gradients - Matching Theme */
  --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --gradient-secondary: linear-gradient(135deg, #ef5d36 0%, #ff6b3d 100%);
  --gradient-tertiary: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  --gradient-success: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  --gradient-warning: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  --gradient-error: linear-gradient(135deg, #fc466b 0%, #3f5efb 100%);
  --gradient-rainbow: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #ef5d36 50%, #ff6b3d 75%, #4facfe 100%);
  
  /* Animation Variables */
  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-bounce: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  
  /* Spacing System */
  --space-0: 0;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-20: 5rem;
  
  /* Border Radius */
  --radius-none: 0;
  --radius-sm: 0.125rem;
  --radius-md: 0.375rem;
  --radius-lg: 0.5rem;
  --radius-xl: 0.75rem;
  --radius-2xl: 1rem;
  --radius-3xl: 1.5rem;
  --radius-full: 9999px;
  
  /* Typography */
  --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-secondary: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
}

/* Dark Mode Colors - Enhanced for Theme */
.dark-mode {
  --bg-primary: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
  --bg-secondary: rgba(26, 26, 46, 0.95);
  --bg-tertiary: rgba(22, 33, 62, 0.8);
  --text-primary: #ffffff;
  --text-secondary: #b3b3b3;
  --text-tertiary: #666666;
  --text-muted: #888888;
  --border-primary: rgba(102, 126, 234, 0.3);
  --border-secondary: rgba(118, 75, 162, 0.3);
  --glass-bg: rgba(26, 26, 46, 0.4);
  --glass-border: rgba(102, 126, 234, 0.15);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
  --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
}

/* Reset and Base Styles */
*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
  color: #ffffff;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  position: relative;
}

/* Enhanced Background Animation */
.background-animation {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

/* Animated Grid */
.animated-grid {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0.1;
}

.grid-line {
  position: absolute;
  background: var(--gradient-primary);
  animation: gridPulse 4s ease-in-out infinite;
}

.grid-line-vertical {
  width: 1px;
  height: 100%;
  animation-delay: calc(var(--i, 0) * 0.5s);
}

.grid-line-horizontal {
  width: 100%;
  height: 1px;
  animation-delay: calc(var(--i, 0) * 0.5s + 2s);
}

/* Enhanced Particle System */
.particle-system {
  position: absolute;
  width: 100%;
  height: 100%;
}

.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.particle-glow {
  width: 6px;
  height: 6px;
  background: var(--gradient-primary);
  box-shadow: 0 0 20px currentColor;
  animation: particleFloat 20s infinite linear;
}

.particle-pulse {
  width: 4px;
  height: 4px;
  background: var(--gradient-secondary);
  animation: particlePulse 3s infinite ease-in-out;
}

.particle-orbit {
  width: 8px;
  height: 8px;
  background: var(--gradient-tertiary);
  animation: particleOrbit 15s infinite linear;
}

.particle-float {
  width: 3px;
  height: 3px;
  background: var(--gradient-success);
  animation: particleFloat 25s infinite linear;
}

/* Dynamic Gradient Orbs */
.gradient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.4;
  animation: orbFloat 20s infinite ease-in-out;
}

.orb-1 {
  width: 400px;
  height: 400px;
  background: var(--gradient-primary);
  top: -200px;
  left: -200px;
  animation-delay: 0s;
}

.orb-2 {
  width: 300px;
  height: 300px;
  background: var(--gradient-secondary);
  top: 50%;
  right: -150px;
  animation-delay: 5s;
}

.orb-3 {
  width: 250px;
  height: 250px;
  background: var(--gradient-tertiary);
  bottom: -125px;
  left: 30%;
  animation-delay: 10s;
}

.orb-4 {
  width: 350px;
  height: 350px;
  background: var(--gradient-success);
  top: 20%;
  left: 50%;
  animation-delay: 15s;
}

/* Floating Geometric Shapes */
.geometric-shapes {
  position: absolute;
  width: 100%;
  height: 100%;
}

.shape {
  position: absolute;
  opacity: 0.1;
  animation: shapeFloat 30s infinite linear;
}

.shape-triangle {
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-bottom: 25px solid var(--primary-500);
  top: 20%;
  left: 10%;
}

.shape-square {
  width: 20px;
  height: 20px;
  background: var(--accent-500);
  transform: rotate(45deg);
  top: 60%;
  right: 20%;
  animation-delay: 5s;
}

.shape-hexagon {
  width: 30px;
  height: 17px;
  background: var(--secondary-500);
    position: relative;
  top: 80%;
  left: 70%;
  animation-delay: 10s;
}

.shape-hexagon::before,
.shape-hexagon::after {
  content: '';
  position: absolute;
  width: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
}

.shape-hexagon::before {
  bottom: 100%;
  border-bottom: 8.5px solid var(--secondary-500);
}

.shape-hexagon::after {
  top: 100%;
  border-top: 8.5px solid var(--secondary-500);
}

.shape-circle {
  width: 25px;
  height: 25px;
  background: var(--gradient-warning);
  border-radius: 50%;
  top: 40%;
  left: 80%;
  animation-delay: 15s;
}

/* Light Rays */
.light-rays {
  position: absolute;
    width: 100%;
  height: 100%;
}

.light-ray {
  position: absolute;
  width: 2px;
  height: 100px;
  background: linear-gradient(to bottom, transparent, var(--primary-400), transparent);
  opacity: 0.3;
  animation: rayMove 8s infinite ease-in-out;
}

.ray-1 {
  top: 10%;
  left: 20%;
  animation-delay: 0s;
}

.ray-2 {
  top: 50%;
  right: 30%;
  animation-delay: 2s;
}

.ray-3 {
  bottom: 20%;
  left: 60%;
  animation-delay: 4s;
}



/* Main Container */
.main-container {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: var(--space-6);
  position: relative;
}

.login-container {
  width: 100%;
  max-width: 480px;
    position: relative;
}

/* Enhanced Login Card - Matching Theme */
.login-card {
  background: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.9) 100%);
  border: 1px solid rgba(102, 126, 234, 0.2);
  border-radius: 20px;
  padding: 2.5rem;
  backdrop-filter: blur(20px);
  box-shadow: 
    0 25px 50px -12px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(102, 126, 234, 0.1) inset;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  position: relative;
  overflow: hidden;
}

.login-card::before {
    content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
}

.login-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.25);
}

.card-glow {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
  background: conic-gradient(from 0deg, var(--primary-500), var(--accent-500), var(--secondary-500), var(--primary-500));
  opacity: 0.1;
  animation: cardGlow 8s linear infinite;
    z-index: -1;
}

/* Enhanced Card Header */
.card-header {
    text-align: center;
  margin-bottom: var(--space-12);
}

.logo-container {
  position: relative;
  display: inline-block;
  margin-bottom: var(--space-8);
}

.logo {
  position: relative;
  width: 70px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
}

.logo-inner {
  width: 50px;
  height: 50px;
  background: var(--gradient-primary);
  border-radius: var(--radius-2xl);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-xl);
  position: relative;
  z-index: 2;
}

.logo-inner i {
  font-size: 24px;
  color: white;
}

.logo-rings {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.ring {
  position: absolute;
  border: 2px solid var(--primary-400);
  border-radius: 50%;
  opacity: 0.3;
  animation: ringPulse 3s infinite ease-in-out;
}

.ring-1 {
  width: 70px;
  height: 70px;
  top: -35px;
  left: -35px;
  animation-delay: 0s;
}

.ring-2 {
  width: 85px;
  height: 85px;
  top: -42.5px;
  left: -42.5px;
  animation-delay: 1s;
}

.ring-3 {
  width: 100px;
  height: 100px;
  top: -50px;
  left: -50px;
  animation-delay: 2s;
}

.welcome-title {
  font-family: var(--font-secondary);
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: var(--space-4);
  line-height: 1.2;
}

.title-line {
    display: block;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: titleGlow 3s ease-in-out infinite alternate;
}

.welcome-subtitle {
  color: var(--text-secondary);
  font-size: 1rem;
  font-weight: 400;
}

/* Enhanced Form Styles */
.login-form {
  margin-bottom: var(--space-10);
}

.form-group {
  margin-bottom: var(--space-8);
}

.input-container {
    position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.input-wrapper {
  position: relative;
  flex: 1;
}

.input-wrapper input {
  width: 100%;
  height: 56px;
  background: rgba(26, 26, 46, 0.3);
  border: 1px solid rgba(102, 126, 234, 0.2);
  border-radius: 12px;
  padding: 0 1.5rem 0 3rem;
  font-size: 0.95rem;
  color: #ffffff;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  backdrop-filter: blur(8px);
}

.input-wrapper input:focus {
  outline: none;
  border-color: rgba(102, 126, 234, 0.6);
  box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
  background: rgba(26, 26, 46, 0.5);
}

.input-wrapper input:focus + label,
.input-wrapper input:not(:placeholder-shown) + label {
  transform: translateY(-32px) scale(0.875);
  color: #667eea;
  font-weight: 500;
}

.input-wrapper label {
    position: absolute;
  left: 3rem;
    top: 50%;
    transform: translateY(-50%);
  color: #b3b3b3;
    font-size: 0.9rem;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  background: rgba(26, 26, 46, 0.95);
  padding: 0 0.5rem;
  border-radius: 6px;
}

.input-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: #666666;
  font-size: 1.125rem;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  z-index: 2;
}

.input-wrapper input:focus ~ .input-icon {
  color: #667eea;
  transform: translateY(-50%) scale(1.1);
}

.input-wrapper:hover .input-icon {
  color: #888888;
}

.password-toggle {
  position: absolute;
  right: var(--space-4);
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  font-size: 1.125rem;
  padding: var(--space-2);
  border-radius: var(--radius-md);
  transition: all var(--transition-normal);
}

.password-toggle:hover {
  color: var(--primary-500);
  background: var(--glass-bg);
}

.input-border {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  width: 0;
  background: var(--gradient-primary);
  transition: width var(--transition-normal);
  border-radius: var(--radius-full);
}

.input-wrapper input:focus ~ .input-border {
  width: 100%;
}

.input-focus-effect {
  position: absolute;
    top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  border-radius: var(--radius-xl);
  background: var(--gradient-primary);
  opacity: 0;
  transition: opacity var(--transition-normal);
  z-index: -1;
}

.input-wrapper input:focus ~ .input-focus-effect {
  opacity: 0.05;
}

.validation-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: all var(--transition-normal);
}

.validation-icon.show {
    opacity: 1;
}

.success-icon {
  color: var(--secondary-500);
}

.error-icon {
  color: #ef4444;
}

.error-message {
  color: #ef4444;
  font-size: 0.875rem;
  margin-top: var(--space-2);
  margin-left: var(--space-12);
  opacity: 0;
  transform: translateY(-8px);
  transition: all var(--transition-normal);
}

.error-message.show {
  opacity: 1;
  transform: translateY(0);
}

.input-wrapper.error input {
  border-color: #ef4444;
  box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
}

.input-wrapper.error .input-icon {
  color: #ef4444;
}

.input-wrapper.success input {
  border-color: var(--secondary-500);
  box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
}

.input-wrapper.success .input-icon {
  color: var(--secondary-500);
}

/* Enhanced Form Options */
.form-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-10);
  flex-wrap: wrap;
  gap: var(--space-4);
}

.checkbox-container {
  display: flex;
  align-items: center;
  cursor: pointer;
  user-select: none;
    position: relative;
}

.checkbox-container input {
  display: none;
}

.checkmark {
  position: relative;
  width: 24px;
  height: 24px;
  background: var(--glass-bg);
  border: 2px solid var(--glass-border);
  border-radius: var(--radius-md);
  margin-right: var(--space-3);
  transition: all var(--transition-normal);
  display: flex;
  align-items: center;
  justify-content: center;
}

.checkmark i {
  font-size: 12px;
  color: white;
  opacity: 0;
  transform: scale(0);
  transition: all var(--transition-bounce);
}

.checkbox-container input:checked + .checkmark {
  background: var(--gradient-primary);
  border-color: var(--primary-500);
  transform: scale(1.1);
}

.checkbox-container input:checked + .checkmark i {
  opacity: 1;
  transform: scale(1);
}

.checkbox-text {
  color: var(--text-secondary);
  font-size: 0.875rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.checkbox-text i {
  font-size: 0.75rem;
  opacity: 0.8;
}

.forgot-password {
  color: var(--primary-500);
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  transition: all var(--transition-normal);
}

.forgot-password i:first-child {
  font-size: 0.75rem;
  opacity: 0.8;
}

.forgot-password:hover {
  color: var(--primary-600);
  transform: translateX(4px);
}

.forgot-password i {
  font-size: 0.75rem;
  transition: transform var(--transition-normal);
}

.forgot-password:hover i {
  transform: translateX(2px);
}

/* Enhanced Login Button - Matching Theme */
.login-button {
  position: relative;
  width: 100%;
  height: 56px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #ef5d36 50%, #ff6b3d 100%);
  background-size: 300% 300%;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
  margin-bottom: 2rem;
  animation: gradientFlow 4s ease-in-out infinite;
}

.login-button:hover {
    transform: translateY(-2px);
  box-shadow: var(--shadow-xl);
}

.login-button:active {
  transform: translateY(0);
}

.button-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  transition: opacity var(--transition-normal);
}

.button-content i:first-child {
  font-size: 1.125rem;
}

.button-arrow {
  font-size: 1rem;
  transition: transform var(--transition-normal);
}

.login-button:hover .button-arrow {
  transform: translateX(4px);
}

.button-loader {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;

<script>
        // Enhanced Theme Management
class ThemeManager {
  constructor() {
    this.themeToggle = document.getElementById('themeToggle');
    this.currentTheme = localStorage.getItem('theme') || 'light-mode';
    this.init();
  }

  init() {
    this.applyTheme(this.currentTheme);
    this.themeToggle.addEventListener('click', () => this.toggleTheme());
    
    // Listen for system theme changes
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
          this.applyTheme(e.matches ? 'dark-mode' : 'light-mode');
        }
      });
    }
  }

  toggleTheme() {
    this.currentTheme = this.currentTheme === 'light-mode' ? 'dark-mode' : 'light-mode';
    this.applyTheme(this.currentTheme);
    localStorage.setItem('theme', this.currentTheme);
    
    // Add theme transition effect
    document.body.style.transition = 'all 0.3s ease';
    setTimeout(() => {
      document.body.style.transition = '';
    }, 300);
  }

  applyTheme(theme) {
    document.body.className = theme;
    this.updateThemeToggle();
    this.updateParticleColors();
  }

  updateThemeToggle() {
    const isDark = this.currentTheme === 'dark-mode';
    this.themeToggle.setAttribute('aria-label', `Switch to ${isDark ? 'light' : 'dark'} mode`);
  }

  updateParticleColors() {
    const particles = document.querySelectorAll('.particle');
    const isDark = this.currentTheme === 'dark-mode';
    
    particles.forEach(particle => {
      if (isDark) {
        particle.style.filter = 'brightness(1.2) saturate(1.3)';
      } else {
        particle.style.filter = 'brightness(0.9) saturate(1.1)';
      }
    });
  }
}

// Enhanced Form Validation
class FormValidator {
  constructor() {
    this.form = document.getElementById('loginForm');
    this.usernameInput = document.getElementById('username');
    this.passwordInput = document.getElementById('password');
    this.usernameError = document.getElementById('usernameError');
    this.passwordError = document.getElementById('passwordError');
    this.loginButton = document.getElementById('loginButton');
    this.rules = {
      username: {
        required: true,
        minLength: 3,
        maxLength: 20,
        pattern: /^[a-zA-Z0-9_]+$/,
        message: 'Username must be 3-20 characters and contain only letters, numbers, and underscores'
      },
      password: {
        required: true,
        minLength: 6,
        message: 'Password must be at least 6 characters'
      }
    };
    this.init();
  }

  init() {
    this.form.addEventListener('submit', (e) => this.handleSubmit(e));
    this.usernameInput.addEventListener('input', () => this.validateField('username'));
    this.usernameInput.addEventListener('blur', () => this.validateField('username'));
    this.passwordInput.addEventListener('input', () => this.validateField('password'));
    this.passwordInput.addEventListener('blur', () => this.validateField('password'));
    this.usernameInput.addEventListener('input', () => this.debounce(() => this.validateField('username'), 300));
    this.passwordInput.addEventListener('input', () => this.debounce(() => this.validateField('password'), 300));
    
    // Prevent any form submission that might cause page redirect
    this.form.addEventListener('submit', (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, true);
    
    // Test error button functionality
    const testErrorButton = document.getElementById('testErrorButton');
    if (testErrorButton) {
      testErrorButton.addEventListener('click', () => {
        if (window.errorBoxHandler) {
          window.errorBoxHandler.showError('This is a test error message to demonstrate the error box functionality.');
        }
      });
    }
  }

  debounce(func, wait) {
    clearTimeout(this.debounceTimer);
    this.debounceTimer = setTimeout(func, wait);
  }

  validateField(fieldName) {
    const input = document.getElementById(fieldName);
    const errorElement = document.getElementById(`${fieldName}Error`);
    const wrapper = input.closest('.input-wrapper');
    const validationIcon = input.closest('.input-container').querySelector('.validation-icon');
    const value = input.value.trim();
    const rule = this.rules[fieldName];
    wrapper.classList.remove('error', 'success');
    errorElement.classList.remove('show');
    validationIcon.classList.remove('show');
    let errorMessage = '';
    if (rule.required && !value) {
      errorMessage = `${fieldName.charAt(0).toUpperCase() + fieldName.slice(1)} is required`;
    } else if (value && rule.minLength && value.length < rule.minLength) {
      errorMessage = `${fieldName.charAt(0).toUpperCase() + fieldName.slice(1)} must be at least ${rule.minLength} characters`;
    } else if (value && rule.maxLength && value.length > rule.maxLength) {
      errorMessage = `${fieldName.charAt(0).toUpperCase() + fieldName.slice(1)} must be no more than ${rule.maxLength} characters`;
    } else if (value && rule.pattern && !rule.pattern.test(value)) {
      errorMessage = rule.message;
    }
    if (errorMessage) {
      wrapper.classList.add('error');
      errorElement.textContent = errorMessage;
      errorElement.classList.add('show');
      validationIcon.classList.add('show');
      return false;
    } else if (value) {
      wrapper.classList.add('success');
      validationIcon.classList.add('show');
    }
    return true;
  }

  validateForm() {
    const isUsernameValid = this.validateField('username');
    const isPasswordValid = this.validateField('password');
    return isUsernameValid && isPasswordValid;
  }

  async handleSubmit(e) {
    e.preventDefault();
    this.hideError();
    this.hideSuccess();
    this.clearErrors();
    
    const formData = new FormData(this.form);
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    
    try {
        const response = await fetch(this.form.action || window.location.pathname, {
            method: 'POST',
            body: formData,
            credentials: 'same-origin',
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/x-www-form-urlencoded',
            }
        });
        
        if (response.ok) {
            // Server returns HTTP redirect (302), browser will automatically follow it
            // No need to manually redirect or parse JSON
            window.location.href = response.url || '/users/dashboard/';
        } else {
            // Only parse JSON for error handling
            const data = await response.json();
            console.log('Login failed with response:', data);
            if (data.errors) {
                if (data.errors.username) this.usernameError.textContent = data.errors.username.join(' ');
                if (data.errors.password) this.passwordError.textContent = data.errors.password.join(' ');
                if (data.errors['__all__']) this.showError(data.errors['__all__'].join(' '));
            }
            this.showError(data.message || 'Invalid username or password.');
            this.shakeForm();
            
            // Fallback alert in case error box doesn't work
            setTimeout(() => {
                if (!document.getElementById('errorBox')?.style.display || 
                    document.getElementById('errorBox').style.display === 'none') {
                    alert(data.message || 'Invalid username or password.');
                }
            }, 100);
        }
    } catch (error) {
        console.error('Login error:', error);
        this.showError('An error occurred during login. Please try again.');
        this.shakeForm();
    }
  }

  setLoading(isLoading) {
    this.loginButton.classList.toggle('loading', isLoading);
    const inputs = this.form.querySelectorAll('input, button');
    inputs.forEach(input => {
      if (input !== this.loginButton) {
        input.disabled = isLoading;
      }
    });
  }

  shakeForm() {
    const loginCard = document.querySelector('.login-card');
    loginCard.style.animation = 'shake 0.5s ease-in-out';
    setTimeout(() => {
      loginCard.style.animation = '';
    }, 500);
  }

  showError(message) {
    console.log('Showing error:', message);
    // Use the ErrorBoxHandler if available, otherwise fall back to notification
    if (window.errorBoxHandler) {
      console.log('Using ErrorBoxHandler');
      window.errorBoxHandler.showError(message);
    } else {
      console.log('Using fallback notification');
      this.createNotification(message, 'error');
    }
  }

  showSuccess(message) {
    this.createNotification(message, 'success');
  }

  createNotification(message, type) {
    // Remove existing notifications
    const existingNotifications = document.querySelectorAll('.notification');
    existingNotifications.forEach(notification => notification.remove());
    const notification = document.createElement('div');
    notification.className = `notification notification-${type}`;
    notification.innerHTML = `
      <div class="notification-content">
        <i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i>
        <span>${message}</span>
      </div>
      <button class="notification-close" onclick="this.parentElement.remove()">
        <i class="fas fa-times"></i>
      </button>
    `;
    notification.style.cssText = `
      position: fixed;
      top: 20px;
      right: 20px;
      background: ${type === 'error' ? 'linear-gradient(135deg, #fc466b 0%, #3f5efb 100%)' : 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)'};
      color: white;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      z-index: 3000;
      font-size: 14px;
      font-weight: 500;
      max-width: 350px;
      animation: slideInRight 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      backdrop-filter: blur(10px);
    `;
    document.body.appendChild(notification);
    setTimeout(() => {
      notification.style.animation = 'slideOutRight 0.3s ease';
      setTimeout(() => {
        notification.remove();
      }, 300);
    }, 5000);
  }

  showSuccessModal() {
    const modal = document.getElementById('successModal');
    modal.classList.add('show');
    this.animateSuccessParticles();
  }

  animateSuccessParticles() {
    const particles = document.querySelectorAll('.success-particles .particle');
    particles.forEach((particle, index) => {
      const angle = (index * 72) * Math.PI / 180;
      const distance = 60;
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;
      particle.style.setProperty('--random-x', `${x}px`);
      particle.style.setProperty('--random-y', `${y}px`);
    });
  }
}

// Enhanced Password Toggle
class PasswordToggle {
  constructor() {
    this.passwordInput = document.getElementById('password');
    this.toggleButton = document.getElementById('passwordToggle');
    this.init();
  }

  init() {
    this.toggleButton.addEventListener('click', () => this.toggle());

  toggle() {

      this.toggleButton.style.transform = 'scale(1)';
    }, 150);

// Enhanced Particle Controller
class ParticleController {
  constructor() {
    this.particles = document.querySelectorAll('.particle');
    this.init();
  }

  init() {
    this.particles.forEach((particle, index) => {
      this.randomizeParticle(particle, index);
    });
    
    // Update particles based on mouse movement
    document.addEventListener('mousemove', (e) => this.handleMouseMove(e));
  }

  randomizeParticle(particle, index) {
    const colors = [
      'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
      'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
      'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
      'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)',
      'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)'
    ];
    
    const randomColor = colors[Math.floor(Math.random() * colors.length)];
    const size = Math.random() * 6 + 3; // 3-9px
    const left = Math.random() * 100;
    const animationDuration = Math.random() * 20 + 15; // 15-35s
    const animationDelay = Math.random() * 10; // 0-10s
    
    particle.style.background = randomColor;
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;
    particle.style.left = `${left}%`;
    particle.style.animationDuration = `${animationDuration}s`;
    particle.style.animationDelay = `${animationDelay}s`;
  }

  handleMouseMove(e) {
    const mouseX = e.clientX / window.innerWidth;
    const mouseY = e.clientY / window.innerHeight;
    
    this.particles.forEach((particle, index) => {
      const speed = (index % 3 + 1) * 0.5;
      const x = (mouseX - 0.5) * speed * 20;
      const y = (mouseY - 0.5) * speed * 20;
      
      particle.style.transform = `translate(${x}px, ${y}px)`;
    });
  }
}

// Enhanced Social Login
class SocialLogin {
  constructor() {
    this.googleButton = document.querySelector('.social-button.google');
    this.githubButton = document.querySelector('.social-button.github');
    this.appleButton = document.querySelector('.social-button.apple');
    this.init();
  }

  init() {
    this.googleButton.addEventListener('click', () => this.handleSocialLogin('google'));
    this.githubButton.addEventListener('click', () => this.handleSocialLogin('github'));
    this.appleButton.addEventListener('click', () => this.handleSocialLogin('apple'));
  }

  async handleSocialLogin(provider) {
    const button = document.querySelector(`.social-button.${provider}`);
    this.setButtonLoading(button, true);
    
    try {
      await this.simulateOAuth(provider);
      this.showSuccess(`${provider.charAt(0).toUpperCase() + provider.slice(1)} login successful!`);
        } catch (error) {
      this.showError(`${provider.charAt(0).toUpperCase() + provider.slice(1)} login failed. Please try again.`);
        } finally {
      this.setButtonLoading(button, false);
    }
  }

  async simulateOAuth(provider) {
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        // Simulate random success/failure (90% success rate)
        if (Math.random() > 0.1) {
          resolve({ success: true, provider });
        } else {
          reject(new Error(`${provider} login failed`));
        }
      }, 1500);
    });
  }

  setButtonLoading(button, isLoading) {
    const icon = button.querySelector('.social-icon i');
    const text = button.querySelector('.social-text');
    
    if (isLoading) {
      icon.className = 'fas fa-spinner fa-spin';
      text.textContent = 'Connecting...';
      button.disabled = true;
      button.style.opacity = '0.7';
    } else {
      const provider = button.classList.contains('google') ? 'google' : 
                     button.classList.contains('github') ? 'github' : 'apple';
      icon.className = `fab fa-${provider}`;
      text.textContent = provider.charAt(0).toUpperCase() + provider.slice(1);
      button.disabled = false;
      button.style.opacity = '1';
    }
  }

  showSuccess(message) {
    // Direct redirect to dashboard on success
    console.log('Social login successful, redirecting to dashboard...');
    window.location.href = '/users/dashboard/';
  }

  showError(message) {
    const formValidator = new FormValidator();
    formValidator.showError(message);
  }
}

// Enhanced Keyboard Navigation
class KeyboardNavigation {
  constructor() {
    this.focusableElements = [];
    this.currentFocus = -1;
    this.init();
  }

  init() {
    this.updateFocusableElements();
    document.addEventListener('keydown', (e) => this.handleKeyDown(e));
    
    // Update focusable elements when DOM changes
    const observer = new MutationObserver(() => {
      this.updateFocusableElements();
    });
    
    observer.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['disabled', 'tabindex']
    });
  }

  updateFocusableElements() {
    this.focusableElements = Array.from(document.querySelectorAll(
      'input:not([disabled]), button:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'
    )).filter(el => el.offsetParent !== null);
  }

  handleKeyDown(e) {
    // Enhanced keyboard shortcuts
    if (e.key === 'Tab') {
      this.updateFocusableElements();
    }
    
    if (e.key === 'Enter' && e.target.type === 'submit') {
      e.preventDefault();
      e.target.click();
    }
    
    // Escape key to close modals
    if (e.key === 'Escape') {
      const modal = document.querySelector('.modal.show');
      if (modal) {
        modal.classList.remove('show');
      }
    }
    
    // Alt + T for theme toggle
    if (e.altKey && e.key === 't') {
      e.preventDefault();
      document.getElementById('themeToggle').click();
    }
  }
}

// Enhanced Performance Optimizer
class PerformanceOptimizer {
  constructor() {
    this.init();
  }

  init() {
    this.setupIntersectionObserver();
    this.setupResizeHandler();
    this.preloadResources();
    this.optimizeAnimations();
  }

  setupIntersectionObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.animationPlayState = 'running';
        } else {
          // Pause animations for elements not in view to save performance
          if (window.innerWidth < 768) {
            entry.target.style.animationPlayState = 'paused';
          }
        }
      });
    }, {
      threshold: 0.1,
      rootMargin: '50px'
    });

    document.querySelectorAll('.particle, .gradient-orb, .shape').forEach(el => {
      observer.observe(el);
    });
  }

  setupResizeHandler() {
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        this.handleResize();
      }, 250);
    });
  }

  handleResize() {
    // Recalculate particle positions and optimize for mobile
    if (window.innerWidth < 768) {
      this.optimizeForMobile();
    } else {
      this.optimizeForDesktop();
    }
  }

  optimizeForMobile() {
    const particles = document.querySelectorAll('.particle');
    particles.forEach((particle, index) => {
      if (index > 6) { // Reduce particle count on mobile
        particle.style.display = 'none';
      }
    });
  }

  optimizeForDesktop() {
    const particles = document.querySelectorAll('.particle');
    particles.forEach(particle => {
      particle.style.display = 'block';
    });
  }

  preloadResources() {
    // Preload critical fonts
    const fontLink = document.createElement('link');
    fontLink.rel = 'preload';
    fontLink.as = 'font';
    fontLink.type = 'font/woff2';
    fontLink.href = 'https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeA.woff2';
    fontLink.crossOrigin = 'anonymous';
    document.head.appendChild(fontLink);
  }

  optimizeAnimations() {
    // Reduce animations based on user preferences
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.style.setProperty('--transition-fast', '0.01ms');
      document.documentElement.style.setProperty('--transition-normal', '0.01ms');
      document.documentElement.style.setProperty('--transition-slow', '0.01ms');
    }
  }
}

// Enhanced Error Box Handler
class ErrorBoxHandler {
  constructor() {
    this.errorBox = document.getElementById('errorBox');
    this.errorMessage = document.getElementById('errorMessage');
    this.errorClose = document.getElementById('errorClose');
    this.errorTimeout = null;
    this.init();
  }

  init() {
    this.setupEventListeners();
  }

  setupEventListeners() {
    // Close button functionality
    this.errorClose.addEventListener('click', () => {
      this.hideError();
    });

    // Auto-hide after 5 seconds
    this.errorBox.addEventListener('animationend', (e) => {
      if (e.animationName === 'errorSlideIn') {
        this.startAutoHide();
      }
    });
  }

  showError(message = 'Invalid username or password. Please try again.') {
    console.log('ErrorBoxHandler.showError called with:', message);
    
    // Clear any existing timeout
    if (this.errorTimeout) {
      clearTimeout(this.errorTimeout);
    }

    // Update error message
    if (this.errorMessage) {
      this.errorMessage.textContent = message;
    } else {
      console.error('Error message element not found');
    }
    
    // Show error box
    if (this.errorBox) {
      this.errorBox.style.display = 'block';
      this.errorBox.classList.remove('hide');
      this.errorBox.classList.add('show');
      console.log('Error box should now be visible');
    } else {
      console.error('Error box element not found');
    }
    
    // Reset progress bar
    const progressBar = this.errorBox?.querySelector('.error-progress');
    if (progressBar) {
      progressBar.style.animation = 'none';
      progressBar.offsetHeight; // Trigger reflow
      progressBar.style.animation = 'errorProgress 5s linear forwards';
    }
  }

  hideError() {
    this.errorBox.classList.add('hide');
    this.errorBox.classList.remove('show');
    
    // Hide after animation completes
    setTimeout(() => {
      this.errorBox.style.display = 'none';
      this.errorBox.classList.remove('hide');
    }, 300);
  }

  startAutoHide() {
    this.errorTimeout = setTimeout(() => {
      this.hideError();
    }, 5000);
  }

  // Method to show different types of errors
  showLoginError() {
    this.showError('Invalid username or password. Please check your credentials and try again.');
  }

  showNetworkError() {
    this.showError('Network error. Please check your connection and try again.');
  }

  showServerError() {
    this.showError('Server error. Please try again later or contact support.');
  }

  showValidationError(field) {
    const messages = {
      username: 'Please enter a valid username.',
      password: 'Please enter your password.',
      email: 'Please enter a valid email address.'
    };
    this.showError(messages[field] || 'Please check your input and try again.');
  }
}

// Enhanced Ripple Effect
class RippleEffect {
  constructor() {
    this.init();
  }

  init() {
    document.addEventListener('click', (e) => {
      if (e.target.closest('.login-button, .social-button')) {
        this.createRipple(e);
      }
    });
  }

  createRipple(e) {
    const button = e.target.closest('.login-button, .social-button');
    const ripple = button.querySelector('.button-ripple, .social-ripple');
    
    if (ripple) {
      const rect = button.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size / 2;
      const y = e.clientY - rect.top - size / 2;
      
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      
      ripple.classList.add('animate');
      
      setTimeout(() => {
        ripple.classList.remove('animate');
      }, 600);
    }
  }
}
